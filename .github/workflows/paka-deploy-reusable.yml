# Shared deploy pipeline (replaces Vercel).
#
#   pull_request (opened/synchronize/reopened) -> preview  https://<app>-pr-<N>.<preview domain>
#   pull_request closed                        -> preview removed (otherwise after 7 days)
#   push to main / workflow_dispatch           -> staging, then production
#
# Builds run on our own runner without secrets. Public build-time values
# (NEXT_PUBLIC_*, VITE_*) come from <working-directory>/.paka-deploy/<kind>.env
# (preview falls back to staging.env). Runtime secrets live only on the deploy host.
#
# Caller needs:
#   permissions: { contents: read, actions: read, id-token: write, pull-requests: write }
#   on: push (main), pull_request (opened, synchronize, reopened, closed), workflow_dispatch
name: paka-deploy

on:
  workflow_call:
    inputs:
      app:
        description: App name as registered on the deploy host
        type: string
        required: true
      type:
        description: "next | static | node (plain Node server: whole working dir, start with `entry`)"
        type: string
        required: true
      working-directory:
        type: string
        default: .
      node-version:
        type: string
        default: '22'
      install:
        type: string
        default: npm ci
      build:
        type: string
        default: npm run build
      output:
        description: "static only: build output directory (relative to working-directory)"
        type: string
        default: dist
      entry:
        description: "node only: server entry file relative to working-directory (listens on $PORT)"
        type: string
        default: server.js
      runs-on:
        type: string
        default: '["ubuntu-24.04"]'
      production:
        description: Deploy to production after staging on push / dispatch
        type: boolean
        default: true
      production-environment:
        description: Optional GitHub environment for the production step (e.g. required reviewers)
        type: string
        default: ''
      deploy-url:
        description: Deploy API base URL (default org/repo variable PAKA_DEPLOY_URL)
        type: string
        default: ''

env:
  DEPLOY_URL: ${{ inputs.deploy-url || vars.PAKA_DEPLOY_URL }}
  APP: ${{ inputs.app }}

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        kind: ${{ fromJSON(github.event_name == 'pull_request' && '["preview"]' || (inputs.production && '["staging","production"]' || '["staging"]')) }}
    environment: ${{ matrix.kind == 'production' && inputs.production-environment || null }}
    concurrency:
      group: paka-deploy-${{ inputs.app }}-${{ matrix.kind }}-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: ${{ matrix.kind == 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Public build env
        working-directory: ${{ inputs.working-directory }}
        env:
          KIND: ${{ matrix.kind }}
          PREVIEW_DOMAIN: ${{ vars.PAKA_PREVIEW_DOMAIN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$KIND" in
            preview) SLOT="pr-$PR_NUMBER" ;;
            staging) SLOT=staging ;;
            *) SLOT=prod ;;
          esac
          # Hostname of this slot; usable as ${PAKA_DEPLOY_HOST} in .paka-deploy/*.env
          export PAKA_DEPLOY_HOST="$APP-$SLOT.${PREVIEW_DOMAIN:-preview.invalid}"
          {
            echo "PAKA_DEPLOY=1"
            echo "PAKA_DEPLOY_KIND=$KIND"
            echo "PAKA_DEPLOY_HOST=$PAKA_DEPLOY_HOST"
          } >> "$GITHUB_ENV"
          f=".paka-deploy/$KIND.env"
          [ -f "$f" ] || { [ "$KIND" = preview ] && f=".paka-deploy/staging.env"; }
          [ -f "$f" ] || { echo "no $f"; exit 0; }
          echo "public build env: $f"
          python3 - "$f" >> "$GITHUB_ENV" <<'PY'
          import os, re, sys
          for n, line in enumerate(open(sys.argv[1]), 1):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              k, _, v = line.partition("=")
              if not re.fullmatch(r"(NEXT_PUBLIC_|VITE_|PUBLIC_)[A-Z0-9_]+", k):
                  sys.exit(f"::error::{sys.argv[1]}:{n}: nur NEXT_PUBLIC_*/VITE_*/PUBLIC_* erlaubt ({k})")
              print(f"{k}={v.replace('${PAKA_DEPLOY_HOST}', os.environ['PAKA_DEPLOY_HOST'])}")
          PY

      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build app
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Package
        id: package
        working-directory: ${{ inputs.working-directory }}
        env:
          TYPE: ${{ inputs.type }}
          OUTPUT: ${{ inputs.output }}
          ENTRY: ${{ inputs.entry }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/paka-bundle"; rm -rf "$B"; mkdir -p "$B"
          if [ "$TYPE" = next ]; then
            [ -d .next/standalone ] || { echo "::error::.next/standalone fehlt – next.config braucht output: process.env.PAKA_DEPLOY ? 'standalone' : undefined"; exit 1; }
            SERVER=$(cd .next/standalone && find . -name server.js -not -path '*/node_modules/*' -printf '%d %p\n' | sort -n | head -1 | cut -d' ' -f2 | sed 's|^\./||')
            ENTRY_DIR=$(dirname "$SERVER"); [ "$ENTRY_DIR" = . ] && ENTRY_DIR=""
            cp -a .next/standalone "$B/app"
            T="$B/app/${ENTRY_DIR:+$ENTRY_DIR/}"
            mkdir -p "$T.next/cache"
            cp -a .next/static "$T.next/static"
            [ -d public ] && cp -a public "${T}public"
            # never ship env files baked by the build
            find "$B/app" -maxdepth 4 -name '.env*' -not -path '*/node_modules/*' -delete
          elif [ "$TYPE" = node ]; then
            [ -f "$ENTRY" ] || { echo "::error::entry $ENTRY fehlt"; exit 1; }
            mkdir -p "$B/app"
            # tracked files + installed node_modules, no git metadata, no env files
            git ls-files -z . | xargs -0 -I{} cp --parents -a {} "$B/app/"
            [ -d node_modules ] && cp -a node_modules "$B/app/"
            find "$B/app" -maxdepth 3 -name '.env*' -not -path '*/node_modules/*' -delete
            SERVER="$ENTRY"
          else
            [ -d "$OUTPUT" ] || { echo "::error::output dir $OUTPUT fehlt"; exit 1; }
            cp -a "$OUTPUT" "$B/site"
            SERVER=""
          fi
          python3 - "$B/paka-deploy.json" "$TYPE" "$SHA" "$SERVER" <<'PY'
          import json, os, sys
          out, typ, sha, entry = sys.argv[1:5]
          crons = []
          if os.path.exists("vercel.json"):
              crons = [{"path": c["path"], "schedule": c["schedule"]} for c in json.load(open("vercel.json")).get("crons", [])]
          m = {"type": typ, "sha": sha, "crons": crons}
          if entry:
              m["entry"] = entry
          json.dump(m, open(out, "w"))
          print(json.dumps(m))
          PY
          tar czf "$RUNNER_TEMP/bundle.tar.gz" -C "$B" .
          rm -rf "$B"
          ls -lh "$RUNNER_TEMP/bundle.tar.gz"
          echo "bundle=$RUNNER_TEMP/bundle.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: paka-deploy-${{ inputs.app }}-${{ matrix.kind }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.bundle }}
          retention-days: 1
          compression-level: 0

      - name: Deploy
        id: deploy
        env:
          KIND: ${{ matrix.kind }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_URL" ] || { echo "::error::PAKA_DEPLOY_URL ist nicht gesetzt"; exit 1; }
          ARTIFACT_URL=$(curl -sS -o /dev/null -w '%{redirect_url}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip")
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=paka-deploy" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          BODY=$(U="$ARTIFACT_URL" python3 -c 'import json,os;print(json.dumps({"app":os.environ["APP"],"kind":os.environ["KIND"],"artifact_url":os.environ["U"]}))')
          RESP=$(curl -sS -X POST "$DEPLOY_URL/v1/deploy" -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' -d "$BODY")
          JOB=$(echo "$RESP" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("job") or "");d.get("job") or print(d,file=sys.stderr)')
          [ -n "$JOB" ] || exit 1
          SEEN=0
          for i in $(seq 1 240); do
            sleep 3
            S=$(curl -sS "$DEPLOY_URL/v1/jobs/$JOB") || continue
            echo "$S" | python3 -c '
          import json,sys
          d=json.load(sys.stdin); seen=int(sys.argv[1])
          for l in d["log"][seen:]: print(l)
          print("::STATE::", d["status"], len(d["log"]), (d.get("result") or {}).get("url",""), file=sys.stderr)' "$SEEN" 2> state.txt
            read -r _ STATUS SEEN URL < state.txt
            case "$STATUS" in
              success) echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "### $APP ($KIND): $URL" >> "$GITHUB_STEP_SUMMARY"; break ;;
              failure) exit 1 ;;
            esac
          done
          [ "$STATUS" = success ] || { echo "::error::deploy timeout"; exit 1; }
          if [ "$KIND" = preview ] && [ -n "$PR_NUMBER" ]; then
            MARK="<!-- paka-deploy:$APP -->"
            TEXT="$MARK
          **Preview $APP:** $URL
          _Commit ${GITHUB_SHA::8}, wird 7 Tage nach dem letzten Deploy bzw. beim Schließen des PR entfernt._"
            CID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
              | M="$MARK" python3 -c 'import json,os,sys;print(next((str(c["id"]) for c in json.load(sys.stdin) if os.environ["M"] in c["body"]),""))')
            J=$(T="$TEXT" python3 -c 'import json,os;print(json.dumps({"body":os.environ["T"]}))')
            if [ -n "$CID" ]; then
              curl -sS -o /dev/null -X PATCH -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/issues/comments/$CID" -d "$J"
            else
              curl -sS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" -d "$J"
            fi
          fi

  preview-remove:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Remove preview
        run: |
          set -euo pipefail
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=paka-deploy" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          curl -sS -X POST "$DEPLOY_URL/v1/preview/remove" -H "Authorization: Bearer $OIDC" \
            -H 'Content-Type: application/json' -d "{\"app\":\"$APP\"}"
