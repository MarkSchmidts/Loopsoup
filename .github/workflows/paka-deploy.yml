# Deploy auf Cloudflare Workers (Static Assets) statt Vercel.
# paka-deploy-cloudflare.yml ist eine Kopie aus PAKA-GmbH/paka-deploy.
#   PR      -> Preview  https://loopsoup-pr-<N>.marksworkers.workers.dev (nach 7 Tagen / beim Schließen gelöscht)
#   main    -> Staging  https://loopsoup-staging.marksworkers.workers.dev, dann Production
name: paka-deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  web:
    uses: ./.github/workflows/paka-deploy-cloudflare.yml
    with:
      app: loopsoup
      install: npm install --ignore-scripts
      output: dist
      node-version: '22'
      spa: true
      workers-subdomain: marksworkers
      domains: loopsoup.org
      redirect-hosts: www.loopsoup.org=loopsoup.org
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_DEPLOY_ACCOUNT_ID }}
